# TEMPLATE: copy, fill in, apply by hand, never commit the filled-in copy. deploy.sh doesn't apply it.
#   cp k8s/secret.example.yaml scheduler-app.yaml   (outside the repo)
#   kubectl apply -f scheduler-app.yaml
# The identity settings (Microsoft/Google clients, token certificates) are a separate secret, scheduler-identity:
# see docs/identity-setup.md, section 4.
apiVersion: v1
kind: Secret
metadata:
  name: scheduler-app
  namespace: scheduler
type: Opaque
stringData:
  # The scheduler database on the shared PostgreSQL in the default namespace (docs/deployment.md, step 1).
  ConnectionStrings__schedulerdb: "Host=postgres.default.svc.cluster.local;Database=scheduler;Username=scheduler;Password=CHANGE_ME;GSS Encryption Mode=Disable"
  # 32 random bytes, base64: openssl rand -base64 32. Changing it breaks every voting link already sent.
  Scheduler__MagicLinkKey: "CHANGE_ME"
  # Who may administer, and who may organize (exact addresses or *@domain). Admins add more organizers at runtime.
  Scheduler__Admins__0: "CHANGE_ME@example.com"
  Scheduler__Organizers__0: "CHANGE_ME@example.com"
  # The SMTP relay that sends as scheduler@sched.marimer.llc (docs/deployment.md, step 2).
  Email__Smtp__Host: "CHANGE_ME"
  Email__Smtp__Port: "587"
  Email__Smtp__Security: "StartTls"
  Email__Smtp__Username: "CHANGE_ME"
  Email__Smtp__Password: "CHANGE_ME"
