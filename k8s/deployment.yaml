apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: scheduler
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/component: app
spec:
  # One replica: the outbox dispatcher, the jobs and the live-update notifier assume a single instance, and
  # Recreate keeps a rollout from running two at once (two dispatchers could send an email twice).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      # Migrations run here, before the app container starts, every time the pod starts. Fleet doesn't run Helm hooks
      # (a hook Job is applied alongside the Deployment, not before it), so an init container is what guarantees the
      # schema is current before new code runs. The EF bundle takes a lock and does nothing when the database is up
      # to date. If it fails, the pod stays in Init and, with Recreate, the old version is already gone: roll back by
      # pinning the previous tag. Keep this image the same as the app container's.
      initContainers:
        - name: migrate
          image: rockylhotka/scheduler:IMAGE_TAG
          command: ["/migrate/efbundle"]
          args: ["--connection", "$(ConnectionStrings__schedulerdb)"]
          env:
            - name: ConnectionStrings__schedulerdb
              valueFrom:
                secretKeyRef:
                  name: scheduler-app
                  key: ConnectionStrings__schedulerdb
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: scheduler
          image: rockylhotka/scheduler:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: scheduler-config
            - secretRef:
                name: scheduler-app
            - secretRef:
                name: scheduler-identity
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
              httpHeaders:
                # AllowedHosts refuses any other Host (400), and the kubelet would send the pod IP.
                - { name: Host, value: scheduler.tail920062.ts.net }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
              httpHeaders:
                - { name: Host, value: scheduler.tail920062.ts.net }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
