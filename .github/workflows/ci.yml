name: CI

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Dockerfile'
      - 'dotnet-tools.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Dockerfile'
      - 'dotnet-tools.json'
      - '.github/workflows/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Scheduler.slnx

      - name: Test
        run: dotnet test Scheduler.slnx --no-build

  # The image is built and pushed by hand (k8s/build.sh); this only catches a Dockerfile or migration bundle that
  # no longer builds.
  docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t scheduler:ci .
